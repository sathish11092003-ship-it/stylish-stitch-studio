<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stylish Stitch Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8B4513;
color:white;
text-align:center;
padding:15px;
font-size:28px;
font-weight:bold;
}

.page{
display:none;
padding:15px;
}

#home{
display:block;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
text-align:center;
padding:10px;
font-size:18px;
}

button{
width:90%;
margin:10px auto 15px;
display:block;
padding:10px;
background:#8B4513;
color:white;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.back{
margin-bottom:15px;
}

</style>

</head>

<body>

<header>
Stylish Stitch Studio
</header>
<!-- HOME PAGE -->

<div id="home" class="page" style="display:block;">

<div class="grid">

<div class="card" onclick="showPage('saree')">
<img src="images/saree.jpg" alt="Saree">
<h3>Saree</h3>
</div>

<div class="card" onclick="showPage('chudi')">
<img src="images/chudi.jpg" alt="Chudidar">
<h3>Chudidar</h3>
</div>

<div class="card" onclick="showPage('blouse')">
<img src="images/blouse.jpg" alt="Blouse">
<h3>Blouse</h3>
</div>

<div class="card" onclick="showPage('kids')">
<img src="images/kids.jpg" alt="Kids Wear">
<h3>Kids Wear</h3>
</div>

</div>

</div>
<!-- SAREE PAGE -->

<button class="back" onclick="showPage('home')">⬅ Back</button>

<h2 style="text-align:center;margin-bottom:15px;">Saree Collection</h2>

<div class="grid">

<div class="card">
<img src="images/saree1.jpg" alt="Saree 1">
<h3>Saree 1</h3>

<script>
function showPage(pageId){

const pages = document.querySelectorAll(".page");
pages.forEach(function(page){
page.style.display = "none";
});

document.getElementById(pageId).style.display = "block";
}
</script>
