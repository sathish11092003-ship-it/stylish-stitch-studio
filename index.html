<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8B4513;
color:white;
text-align:center;
padding:15px;
font-size:28px;
font-weight:bold;
}

.page{
display:none;
padding:15px;
}

#home{
display:block;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:auto;
max-height:none;
object-fit:contain;
display:block;
}

.card h3{
text-align:center;
padding:10px;
font-size:18px;
}

button{
width:90%;
margin:10px auto 15px;
display:block;
padding:10px;
background:#8B4513;
color:white;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.back{
margin-bottom:15px;
}

/* Floating WhatsApp + Location controls */
.whatsapp-float{
position:fixed;
right:18px;
bottom:78px;
width:56px;
height:56px;
border-radius:50%;
background:#25D366;
color:white;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:0;
box-shadow:0 4px 12px rgba(0,0,0,.28);
z-index:9999;
}
.whatsapp-float svg{width:32px;height:32px;fill:#fff;}
.whatsapp-float:active{transform:scale(.94);}
.location-bottom{
position:fixed;
left:50%;
bottom:15px;
transform:translateX(-50%);
background:#8B4513;
color:white;
text-decoration:none;
padding:11px 24px;
border-radius:28px;
font-size:15px;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9998;
white-space:nowrap;
}
.location-bottom:active{transform:translateX(-50%) scale(.96);}

.phone-bottom{
position:fixed;
left:16px;
bottom:15px;
background:#8B4513;
color:white;
text-decoration:none;
padding:11px 16px;
border-radius:28px;
font-size:14px;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9998;
white-space:nowrap;
}
.phone-bottom:active{transform:scale(.96);}
@media(max-width:480px){
.phone-bottom{left:10px;bottom:12px;font-size:13px;padding:10px 13px;}
.location-bottom{bottom:12px;}
}

@media(max-width:480px){
.grid{gap:10px;}
.card h3{font-size:15px;padding:8px;}
.whatsapp-float{right:14px;bottom:72px;width:52px;height:52px;font-size:0;}
