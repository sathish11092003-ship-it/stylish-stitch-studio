<!DOCTYPE html>

<meta charset="UTF-8">

<title>Stylish Stitch Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8B4513;
color:white;
text-align:center;
padding:15px;
font-size:28px;
font-weight:bold;
}

.page{
display:none;
padding:15px;
}

#home{
display:block;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:auto;
max-height:none;
object-fit:contain;
display:block;
}

.card h3{
text-align:center;
padding:10px;
font-size:18px;
}

button{
width:90%;
margin:10px auto 15px;
display:block;
padding:10px;
background:#8B4513;
color:white;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.back{
margin-bottom:15px;
}

.contact-bar{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:8px 6px;
background:#fff;
flex-wrap:wrap;
}
.contact-bar a{
text-decoration:none;
color:#fff;
background:#8B4513;
padding:8px 13px;
border-radius:22px;
font-size:13px;
font-weight:bold;
box-shadow:0 2px 6px rgba(0,0,0,.18);
}
.contact-bar a:hover{transform:scale(1.03);}
@media(max-width:480px){
.grid{gap:10px;}
.card h3{font-size:15px;padding:8px;}
.contact-bar{gap:6px;}
.contact-bar a{font-size:12px;padding:7px 10px;}
}
</style>

</head>
